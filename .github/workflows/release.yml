name: Release

# Publishes the version in `build.gradle.kts`, and **creates the tag itself** at the end.
#
# The tag used to be the trigger, and that ordering could not work for Swift. A `binaryTarget` needs
# the artefact's SHA256 in `Package.swift`, a checksum cannot be known until the artefact exists, and
# the artefact is built from the tag — so the manifest inside a tag named the *previous* release's
# binary, and a consumer pinning one tag for Gradle and the same tag for Swift got a Swift package
# pointing at the wrong version or, for the first release, at nothing at all. An external adopter's
# acceptance criterion was one tag for both platforms, and they were right that it should be.
#
# So the order is inverted: this workflow builds, publishes, writes the checksum into `Package.swift`,
# commits that, and only then tags the commit it wrote. One tag, correct for both ecosystems, and the
# release page hangs off it.
#
# Four jobs, because the work has four homes:
#
#   verify   Linux **and** macOS. It was Linux alone, and that skipped every Apple gate: `swift` is
#            macOS-only and `ios-ui` needs a simulator, so a release shipped the Swift package having
#            run none of its tests. The oracles and the release preconditions stay on the Linux leg —
#            asked once per release, not once per host.
#   instrumented
#            Linux, with an emulator. The Android suites, which `check.sh` inside `verify` skips
#            because a release runner has no device — so until this job existed, every release
#            published the two Android artifacts with their tests compiled and never run. Shares one
#            definition with `ci.yml`; see `.github/workflows/instrumented.yml`.
#   publish  macOS. The only host that can compile every target: Apple targets need Xcode, and
#            Kotlin/Native cross-compiles the Linux target from macOS, so one host produces the
#            complete set. `ktecma262` 0.1.2 was built on Linux and shipped with no native variants.
#   release  Linux. Writes the manifest, tags it, and makes the release page from the changelog.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    # **Both hosts, because a release publishes both halves.** This job was Linux-only, and
    # `check.sh` on Linux skips the two gates that cover everything Apple: `swift` is macOS-only and
    # `ios-ui` needs a simulator runtime. `publish` below builds the XCFramework and writes
    # `Package.swift`, so a release was shipping the Swift package having run none of its 158 tests
    # and none of the three UI tests that are the only end-to-end check of VoiceOver. 0.5.0 went out
    # that way.
    #
    # The same hole as the instrumented suites, which `verify` also skipped for want of a device and
    # which now have their own job. The oracles and the release-specific preconditions stay on Linux;
    # everything else runs on both, which is what `ci.yml` already does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Check this version has not been released
        # Linux only: asked once per release, not once per host.
        if: matrix.os == 'ubuntu-latest'
        # The version in the build file is the one thing that names a release, so the guard is that
        # its tag does not exist yet. Re-running for a version already tagged would publish nothing
        # to Central — a version there is immutable — and would leave a second tag pointing at a
        # different commit, which is worse than a failed build.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo '::error::No version = "x.y.z" line in build.gradle.kts.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already tagged. Bump the version in build.gradle.kts."
            exit 1
          fi
          echo "Releasing $version; v$version does not exist yet."

      - name: Check the changelog has a section for this version
        # Linux only: asked once per release, not once per host.
        if: matrix.os == 'ubuntu-latest'
        # Fails here rather than after publishing, when the release notes are the only thing left and
        # the artifacts are already immutable.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          ./.github/scripts/changelog-section.sh "$version" > /dev/null
          echo "CHANGELOG.md has a section for $version."

      - name: Record upstream's test vectors
        # **This step is the protection, not a convenience.** Each replay guards its own vector file
        # with an assumption, so a missing file *skips* the whole test — the `replayed >= N` floor
        # below it never runs, because a skipped test runs nothing. (The floor catches a set that is
        # partly there, which is a different failure.) The comment here used to claim the opposite,
        # which mattered: it read as though forgetting this step would fail loudly, and forgetting it
        # would in fact have published green with eleven replays silently skipped.
        #
        # The vectors are gitignored by design, being derived from the pinned upstream packages.
        run: ./scripts/record-upstream-vectors.sh

      - name: Render upstream's Vega-Lite scenes
        # **This arms a gate that runs inside `check.sh`.** `VegaLiteFixtureDifferentialTest` is
        # 1126 cases and the one that catches a specification matching upstream property for property
        # while still drawing the wrong chart; it answers a missing reference with an *assumption*,
        # and the references are gitignored, being derived. `ci.yml` has rendered them since the
        # commit that added them; this file was never updated, so **every release since has published
        # with that gate skipped in full** — while the publish job's own comment below said verify
        # "has already run that comparison in full".
        #
        # Before `check.sh`, not after: the gate runs in its Gradle step, so references written
        # afterwards arm it for a run that has already finished.
        run: ./scripts/vega-lite-oracle.sh --references-only

      - name: Check
        # A release is never published from a red build. This is the gate the repository uses, which
        # compiles every target and runs the JVM and native suites.
        #
        # `--fast` because the two oracles are their own steps below. `check.sh` grew the ability to
        # run them itself, and this file was not updated with `ci.yml` when it did — so every release
        # since has regenerated upstream's scenes twice and compared them twice, for about four
        # minutes of nothing. Keeping them separate is deliberate rather than incidental: they are
        # named steps in the log, and a differential failure should say which grammar it was.
        run: ./scripts/check.sh --fast

      - name: Differential tests against upstream Vega
        # Linux only; the macOS leg runs `check.sh --fast`, which leaves the oracles to this host.
        if: matrix.os == 'ubuntu-latest'
        # Regenerates upstream's own scenes with the pinned Vega and compares. The point of the
        # project, so it gates the release.
        run: ./scripts/oracle.sh

      - name: Differential tests against upstream Vega-Lite
        # Linux only; the macOS leg runs `check.sh --fast`, which leaves the oracles to this host.
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/vega-lite-oracle.sh

  # The Android suites, on a real device, before anything is published.
  #
  # `verify` above runs `check.sh`, which runs the instrumented tests when a device is on adb and
  # prints `instrumented SKIPPED — no device on adb` when one is not. A release runner has no
  # emulator, so every release this project has cut published `vega-android-canvas` and
  # `vega-compose` having compiled their tests and never run them — and those two modules have no
  # other tests at all. This is the job that makes the Android artifacts as checked as the rest.
  #
  # Alongside `verify` rather than after it: they are independent preconditions and there is no
  # reason to make the slower one wait for the other.
  instrumented:
    name: Instrumented
    uses: ./.github/workflows/instrumented.yml

  publish:
    name: Build and publish (macOS)
    # **Both preconditions, not just the Linux one.** A `needs` that named only `verify` would let a
    # red Android run publish, which is the state this job was added to end.
    needs: [verify, instrumented]
    runs-on: macos-latest
    outputs:
      # **Whether the Gradle modules actually reached Maven Central.**
      #
      # The publish step skips with `exit 0` when the credentials are not configured, which is
      # deliberate — a fork can build and attach the XCFramework without them. What was not
      # deliberate is what happened next: the release job tagged, pushed and wrote a page telling
      # readers to add `io.github.mgilbir.astervega:vega-runtime:$version` to their build, for
      # coordinates that did not exist. And a tag cannot be moved, so that version could never be
      # released properly afterwards.
      published: ${{ steps.central.outputs.published }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        # The recorder below is a Node script that reads the pinned packages and clones upstream's own
        # test files. Pinned here as in the verify job rather than taken from whatever the runner image
        # ships, because what it records is the reference the JVM replays against.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Record upstream's test vectors
        # **The gate needs its inputs on this host too.** `build` below runs every test, and the
        # replay guards assert the harness has not shrunk — `replayed >= 60` — so without the vectors
        # they *fail* rather than skip. The verify job records them on its own runner and this one is
        # a different machine with a fresh clone, which is exactly how the 0.1.0 attempt died: sixteen
        # minutes of green compiles and then `UpstreamTransformVectorsTest`, on the one host where
        # nothing had recorded them. CI does this on both hosts for the same reason.
        run: ./scripts/record-upstream-vectors.sh

      - name: Build every target
        # The Vega-Lite *scene* references are deliberately not rendered here. Their gate answers a
        # missing reference with an assumption rather than a failure, so it skips quietly; the verify
        # job has already run that comparison in full on Linux, and re-rendering sixteen megabytes on
        # a macOS runner would buy nothing but minutes. This job exists to compile the Apple targets —
        # the only host that can — and to publish.
        run: ./gradlew build --stacktrace

      - name: Check every declared target is in the module metadata
        # The check that would have caught `ktecma262` 0.1.2: a host that cannot build a target
        # silently drops its variant, and the artifact publishes anyway pointing at nothing.
        run: ./gradlew verifyPublishedVariants

      - name: Publish to Maven Central
        id: central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Recorded either way, and read by the release job: a page that names Maven Central
          # coordinates has to be a page whose coordinates exist.
          echo "published=false" >> "$GITHUB_OUTPUT"
          if [ -z "${CENTRAL_TOKEN_USERNAME:-}" ] || [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::Maven Central credentials or signing key not configured, so the Gradle"
            echo "::warning::modules will NOT be published. The tag and the release page will still"
            echo "::warning::be created, with the XCFramework attached and no Maven coordinates on"
            echo "::warning::them. A tag cannot be moved, so this version cannot be published to"
            echo "::warning::Central later under the same number. See the Releasing section of"
            echo "::warning::README.md."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)

          # One bundle holding every publication, checked before it leaves the runner. Uploading
          # publications separately lets the server assemble the deployment from whatever it believes
          # arrived; for `ktecma262` 0.1.3 it assembled four modules out of seven, and the ones it
          # dropped had uploaded successfully and were never reported as failures.
          ./gradlew centralBundle verifyCentralBundle --no-configuration-cache
          bundle="build/distributions/aster-kotlin-$version-bundle.zip"
          modules="build/central-bundle/io/github/mgilbir/astervega"
          echo "Modules in the bundle:"
          ls "$modules" | sed 's/^/  /'

          # Bearer credential is base64("user:pass"). Masked immediately and passed to curl on stdin,
          # so it never appears in a process argument.
          auth=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          hdr() { printf 'header = "Authorization: Bearer %s"\n' "$auth"; }

          # publishingType=USER_MANAGED: the Portal validates and waits. Releasing to Central is
          # irreversible, so it stays a decision rather than a side effect of pushing a tag.
          id=$(hdr | curl -sS -K - --fail-with-body -X POST \
            --form "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=aster-kotlin%20$version&publishingType=USER_MANAGED")
          echo "Deployment $id"

          for _ in $(seq 1 60); do
            hdr | curl -sS -K - -X POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id" > status.json
            state=$(python3 -c "import json;print(json.load(open('status.json'))['deploymentState'])")
            echo "  state: $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) break ;;
              FAILED)
                echo "::error::Deployment $id failed validation."
                cat status.json
                exit 1
                ;;
            esac
            sleep 10
          done

          # The upload returning 200 says nothing about what the deployment contains.
          .github/scripts/check-deployment.py status.json "$modules"
          rm -f status.json

          # Only now, past every check: the bundle validated and holds every module.
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Release it at https://central.sonatype.com/publishing/deployments"

      - name: Build the XCFramework for Swift
        # Release rather than debug: this is the binary a Swift Package Manager consumer downloads.
        run: ./gradlew :vega-runtime:assembleAsterVegaReleaseXCFramework

      - name: Check the XCFramework carries the platforms the manifest promises
        # 0.1.0 shipped a package declaring `platforms: [.macOS(.v13), .iOS(.v16)]` and an XCFramework
        # holding the two iOS slices and nothing else, so a consumer running `swift build` on a Mac —
        # a plain command-line build, an Xcode preview, a package-scheme check — got `no such module
        # 'AsterVega'`. The iOS slices were fine; the platform the manifest also promised had nothing
        # behind it. Nothing in the build failed, because nothing compared the two.
        run: |
          set -euo pipefail
          python3 - "vega-runtime/build/XCFrameworks/release/AsterVega.xcframework/Info.plist" <<'PY'
          import plistlib, sys
          libraries = plistlib.load(open(sys.argv[1], "rb"))["AvailableLibraries"]
          have = {
              (library["SupportedPlatform"], library.get("SupportedPlatformVariant", "device"))
              for library in libraries
          }
          want = {("ios", "device"), ("ios", "simulator"), ("macos", "device")}
          print("slices:", sorted(have))
          missing = sorted(want - have)
          if missing:
              raise SystemExit(f"::error::XCFramework is missing {missing}; Package.swift promises iOS and macOS.")
          PY

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          mkdir -p artifacts

          # Zipped at the top of the XCFramework directory, because that is what `binaryTarget`
          # expects to unpack — a zip of the parent directory resolves to a path SwiftPM cannot find.
          xc=vega-runtime/build/XCFrameworks/release/AsterVega.xcframework
          test -d "$xc" || { echo "::error::no XCFramework at $xc"; exit 1; }
          ( cd "$(dirname "$xc")" && zip -qry "AsterVega-$version.xcframework.zip" AsterVega.xcframework )
          mv "$(dirname "$xc")/AsterVega-$version.xcframework.zip" artifacts/

          # The checksum SwiftPM verifies. Written beside the zip so the release page carries both.
          ( cd artifacts && shasum -a 256 "AsterVega-$version.xcframework.zip" | cut -d' ' -f1 \
              > "AsterVega-$version.xcframework.zip.sha256" )
          echo "checksum: $(cat "artifacts/AsterVega-$version.xcframework.zip.sha256")"

          # klibs as well as jars: the native targets produce no jar, and attaching only jars would
          # make the release page look JVM-only.
          find . -path ./artifacts -prune -o \
            \( -name '*.jar' -o -name '*.klib' \) -path '*/build/libs/*' -print \
            -exec cp {} artifacts/ \; | wc -l
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aster-kotlin-artifacts
          path: artifacts/
          retention-days: 90

  release:
    name: Tag and release (Linux)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes to the repository: the manifest commit, the tag, and the release page.
      contents: write

    steps:
      # The **dispatched commit**, not whatever `main` points at by now. The artefacts were built from
      # this tree, so this is the tree the tag has to name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aster-kotlin-artifacts
          path: artifacts

      - name: Point Package.swift at the XCFramework that was just built
        # First, not last. The checksum can only be known now that the artefact exists, and the tag has
        # to be able to name a commit whose manifest is already correct — that is the whole reason this
        # workflow tags rather than being triggered by a tag.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          checksum=$(cat "artifacts/AsterVega-$version.xcframework.zip.sha256")
          test -n "$checksum"
          python3 - "$version" "$checksum" <<'PY'
          import re, sys
          version, checksum = sys.argv[1], sys.argv[2]
          text = open("Package.swift", encoding="utf-8").read()
          text = re.sub(r'let version = "[^"]*"', f'let version = "{version}"', text)
          text = re.sub(r'let checksum = "[^"]*"', f'let checksum = "{checksum}"', text)
          open("Package.swift", "w", encoding="utf-8").write(text)
          PY
          grep -q "$checksum" Package.swift
          grep -q "let version = \"$version\"" Package.swift

          if ! git diff --quiet Package.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Package.swift
            git commit -m "Point Package.swift at the $version XCFramework

          Written by the release workflow once the asset exists, a checksum not being
          knowable before then. The tag for $version is this commit, so a Swift
          consumer and a Gradle consumer pin the same one."
          fi

          # Nothing but the manifest may differ from what was built, or the tag would name a tree the
          # artefacts did not come from.
          changed=$(git diff --name-only "${{ github.sha }}" HEAD)
          if [ -n "$changed" ] && [ "$changed" != "Package.swift" ]; then
            echo "::error::the release commit changes more than Package.swift: $changed"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Push the manifest and tag it
        # The push to `main` is a **fast-forward or nothing**: if someone landed a commit while the
        # release was building, the artefacts on the runner are no longer what `main` says, and the
        # honest outcome is a failed release rather than a tag that is a lie. Nothing has been made
        # public at this point — the Central deployment is still USER_MANAGED and unreleased.
        run: |
          set -euo pipefail
          git push origin "HEAD:main"
          git tag -a "v$version" -m "Aster Vega $version"
          git push origin "refs/tags/v$version"
          echo "Tagged v$version at $(git rev-parse HEAD)."

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          set -euo pipefail

          # Notes come from the changelog, so the release page and the file in the repository cannot
          # drift apart.
          ./.github/scripts/changelog-section.sh "$version" > notes.md
          {
            echo ""
            echo "## Using it"
            echo ""
            # **Only when they exist.** The publish job skips when its credentials are not
            # configured, and this page used to name Maven Central coordinates regardless — telling
            # a reader to add a dependency that resolves to nothing. Since a tag cannot be moved,
            # the version was also unreleasable afterwards.
            if [ "$PUBLISHED" = "true" ]; then
              echo "Gradle — every module is on Maven Central under \`io.github.mgilbir.astervega\`:"
              echo ""
              echo '```kotlin'
              echo "implementation(\"io.github.mgilbir.astervega:vega-runtime:$version\")"
              echo "implementation(\"io.github.mgilbir.astervega:vega-lite:$version\")"
              echo '```'
              echo ""
            else
              echo "> **The Gradle modules were not published for this version.** The publish job's"
              echo "> Maven Central credentials were not configured, so nothing was uploaded and"
              echo "> \`io.github.mgilbir.astervega:*:$version\` does not resolve. The XCFramework"
              echo "> below was built from this tag and is complete."
              echo ""
            fi
            echo "Swift Package Manager — the XCFramework is attached below, and \`Package.swift\` at"
            echo "tag \`v$version\` names it with its checksum:"
            echo ""
            echo '```swift'
            echo ".package(url: \"https://github.com/${GITHUB_REPOSITORY}\", from: \"$version\")"
            echo '```'
          } >> notes.md

          # **`--latest` is a claim about ordering, not about recency.** It was passed
          # unconditionally, so publishing a patch for an older line — 0.2.4 after 0.3.0 — would
          # have moved the badge backwards and changed what `gh release view` and the repository
          # sidebar point at. `sort -V` over the existing tags decides it.
          #
          # Fetched, because this job checked out one commit: `actions/checkout` brings no tags at
          # depth 1, so the local tag list would otherwise hold only the one pushed a step ago and
          # every release would call itself the latest by default.
          git fetch --tags --quiet origin
          newest=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ "$newest" = "$version" ]; then
            latest=(--latest)
          else
            latest=(--latest=false)
            echo "::notice::v$newest is newer than v$version, so this release is not marked latest."
          fi

          gh release create "v$version" \
            --title "Aster Vega $version" \
            --notes-file notes.md \
            "${latest[@]}" \
            artifacts/*
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$version"
