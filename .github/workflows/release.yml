name: Release

# Publishes the version in `build.gradle.kts`, and **creates the tag itself** at the end.
#
# The tag used to be the trigger, and that ordering could not work for Swift. A `binaryTarget` needs
# the artefact's SHA256 in `Package.swift`, a checksum cannot be known until the artefact exists, and
# the artefact is built from the tag — so the manifest inside a tag named the *previous* release's
# binary, and a consumer pinning one tag for Gradle and the same tag for Swift got a Swift package
# pointing at the wrong version or, for the first release, at nothing at all. An external adopter's
# acceptance criterion was one tag for both platforms, and they were right that it should be.
#
# So the order is inverted: this workflow builds, publishes, writes the checksum into `Package.swift`,
# commits that, and only then tags the commit it wrote. One tag, correct for both ecosystems, and the
# release page hangs off it.
#
# Three jobs, because the work has three homes:
#
#   verify   Linux. The suite that does not need a Mac, and the oracles that regenerate upstream's
#            own output and compare against it. No reason to pay macOS rates for it.
#   publish  macOS. The only host that can compile every target: Apple targets need Xcode, and
#            Kotlin/Native cross-compiles the Linux target from macOS, so one host produces the
#            complete set. `ktecma262` 0.1.2 was built on Linux and shipped with no native variants.
#   release  Linux. Writes the manifest, tags it, and makes the release page from the changelog.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check this version has not been released
        # The version in the build file is the one thing that names a release, so the guard is that
        # its tag does not exist yet. Re-running for a version already tagged would publish nothing
        # to Central — a version there is immutable — and would leave a second tag pointing at a
        # different commit, which is worse than a failed build.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo '::error::No version = "x.y.z" line in build.gradle.kts.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already tagged. Bump the version in build.gradle.kts."
            exit 1
          fi
          echo "Releasing $version; v$version does not exist yet."

      - name: Check the changelog has a section for this version
        # Fails here rather than after publishing, when the release notes are the only thing left and
        # the artifacts are already immutable.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          ./.github/scripts/changelog-section.sh "$version" > /dev/null
          echo "CHANGELOG.md has a section for $version."

      - name: Record upstream's test vectors
        # `check.sh` says it will skip the replays without these, but the replay guards also assert
        # the harness has not *shrunk* — `replayed >= 60` — so on a fresh clone they fail rather than
        # skip. The vectors are gitignored by design, being derived, so CI records them first.
        run: ./scripts/record-upstream-vectors.sh

      - name: Check
        # A release is never published from a red build. This is the gate the repository uses, which
        # compiles every target and runs the JVM and native suites.
        run: ./scripts/check.sh

      - name: Differential tests against upstream Vega
        # Regenerates upstream's own scenes with the pinned Vega and compares. The point of the
        # project, so it gates the release.
        run: ./scripts/oracle.sh

      - name: Differential tests against upstream Vega-Lite
        run: ./scripts/vega-lite-oracle.sh

  publish:
    name: Build and publish (macOS)
    needs: verify
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        # The recorder below is a Node script that reads the pinned packages and clones upstream's own
        # test files. Pinned here as in the verify job rather than taken from whatever the runner image
        # ships, because what it records is the reference the JVM replays against.
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Record upstream's test vectors
        # **The gate needs its inputs on this host too.** `build` below runs every test, and the
        # replay guards assert the harness has not shrunk — `replayed >= 60` — so without the vectors
        # they *fail* rather than skip. The verify job records them on its own runner and this one is
        # a different machine with a fresh clone, which is exactly how the 0.1.0 attempt died: sixteen
        # minutes of green compiles and then `UpstreamTransformVectorsTest`, on the one host where
        # nothing had recorded them. CI does this on both hosts for the same reason.
        run: ./scripts/record-upstream-vectors.sh

      - name: Build every target
        # The Vega-Lite *scene* references are deliberately not rendered here. Their gate answers a
        # missing reference with an assumption rather than a failure, so it skips quietly; the verify
        # job has already run that comparison in full on Linux, and re-rendering sixteen megabytes on
        # a macOS runner would buy nothing but minutes. This job exists to compile the Apple targets —
        # the only host that can — and to publish.
        run: ./gradlew build --stacktrace

      - name: Check every declared target is in the module metadata
        # The check that would have caught `ktecma262` 0.1.2: a host that cannot build a target
        # silently drops its variant, and the artifact publishes anyway pointing at nothing.
        run: ./gradlew verifyPublishedVariants

      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${CENTRAL_TOKEN_USERNAME:-}" ] || [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::Maven Central credentials or signing key not configured;"
            echo "::notice::skipping publish. See the Releasing section of README.md."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)

          # One bundle holding every publication, checked before it leaves the runner. Uploading
          # publications separately lets the server assemble the deployment from whatever it believes
          # arrived; for `ktecma262` 0.1.3 it assembled four modules out of seven, and the ones it
          # dropped had uploaded successfully and were never reported as failures.
          ./gradlew centralBundle verifyCentralBundle --no-configuration-cache
          bundle="build/distributions/aster-kotlin-$version-bundle.zip"
          modules="build/central-bundle/io/github/mgilbir/astervega"
          echo "Modules in the bundle:"
          ls "$modules" | sed 's/^/  /'

          # Bearer credential is base64("user:pass"). Masked immediately and passed to curl on stdin,
          # so it never appears in a process argument.
          auth=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          hdr() { printf 'header = "Authorization: Bearer %s"\n' "$auth"; }

          # publishingType=USER_MANAGED: the Portal validates and waits. Releasing to Central is
          # irreversible, so it stays a decision rather than a side effect of pushing a tag.
          id=$(hdr | curl -sS -K - --fail-with-body -X POST \
            --form "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=aster-kotlin%20$version&publishingType=USER_MANAGED")
          echo "Deployment $id"

          for _ in $(seq 1 60); do
            hdr | curl -sS -K - -X POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id" > status.json
            state=$(python3 -c "import json;print(json.load(open('status.json'))['deploymentState'])")
            echo "  state: $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) break ;;
              FAILED)
                echo "::error::Deployment $id failed validation."
                cat status.json
                exit 1
                ;;
            esac
            sleep 10
          done

          # The upload returning 200 says nothing about what the deployment contains.
          .github/scripts/check-deployment.py status.json "$modules"
          rm -f status.json

          echo "Release it at https://central.sonatype.com/publishing/deployments"

      - name: Build the XCFramework for Swift
        # Release rather than debug: this is the binary a Swift Package Manager consumer downloads.
        run: ./gradlew :vega-runtime:assembleAsterVegaReleaseXCFramework

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          mkdir -p artifacts

          # Zipped at the top of the XCFramework directory, because that is what `binaryTarget`
          # expects to unpack — a zip of the parent directory resolves to a path SwiftPM cannot find.
          xc=vega-runtime/build/XCFrameworks/release/AsterVega.xcframework
          test -d "$xc" || { echo "::error::no XCFramework at $xc"; exit 1; }
          ( cd "$(dirname "$xc")" && zip -qry "AsterVega-$version.xcframework.zip" AsterVega.xcframework )
          mv "$(dirname "$xc")/AsterVega-$version.xcframework.zip" artifacts/

          # The checksum SwiftPM verifies. Written beside the zip so the release page carries both.
          ( cd artifacts && shasum -a 256 "AsterVega-$version.xcframework.zip" | cut -d' ' -f1 \
              > "AsterVega-$version.xcframework.zip.sha256" )
          echo "checksum: $(cat "artifacts/AsterVega-$version.xcframework.zip.sha256")"

          # klibs as well as jars: the native targets produce no jar, and attaching only jars would
          # make the release page look JVM-only.
          find . -path ./artifacts -prune -o \
            \( -name '*.jar' -o -name '*.klib' \) -path '*/build/libs/*' -print \
            -exec cp {} artifacts/ \; | wc -l
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aster-kotlin-artifacts
          path: artifacts/
          retention-days: 90

  release:
    name: Tag and release (Linux)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes to the repository: the manifest commit, the tag, and the release page.
      contents: write

    steps:
      # The **dispatched commit**, not whatever `main` points at by now. The artefacts were built from
      # this tree, so this is the tree the tag has to name.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: aster-kotlin-artifacts
          path: artifacts

      - name: Point Package.swift at the XCFramework that was just built
        # First, not last. The checksum can only be known now that the artefact exists, and the tag has
        # to be able to name a commit whose manifest is already correct — that is the whole reason this
        # workflow tags rather than being triggered by a tag.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          checksum=$(cat "artifacts/AsterVega-$version.xcframework.zip.sha256")
          test -n "$checksum"
          python3 - "$version" "$checksum" <<'PY'
          import re, sys
          version, checksum = sys.argv[1], sys.argv[2]
          text = open("Package.swift", encoding="utf-8").read()
          text = re.sub(r'let version = "[^"]*"', f'let version = "{version}"', text)
          text = re.sub(r'let checksum = "[^"]*"', f'let checksum = "{checksum}"', text)
          open("Package.swift", "w", encoding="utf-8").write(text)
          PY
          grep -q "$checksum" Package.swift
          grep -q "let version = \"$version\"" Package.swift

          if ! git diff --quiet Package.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Package.swift
            git commit -m "Point Package.swift at the $version XCFramework

          Written by the release workflow once the asset exists, a checksum not being
          knowable before then. The tag for $version is this commit, so a Swift
          consumer and a Gradle consumer pin the same one."
          fi

          # Nothing but the manifest may differ from what was built, or the tag would name a tree the
          # artefacts did not come from.
          changed=$(git diff --name-only "${{ github.sha }}" HEAD)
          if [ -n "$changed" ] && [ "$changed" != "Package.swift" ]; then
            echo "::error::the release commit changes more than Package.swift: $changed"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Push the manifest and tag it
        # The push to `main` is a **fast-forward or nothing**: if someone landed a commit while the
        # release was building, the artefacts on the runner are no longer what `main` says, and the
        # honest outcome is a failed release rather than a tag that is a lie. Nothing has been made
        # public at this point — the Central deployment is still USER_MANAGED and unreleased.
        run: |
          set -euo pipefail
          git push origin "HEAD:main"
          git tag -a "v$version" -m "Aster Vega $version"
          git push origin "refs/tags/v$version"
          echo "Tagged v$version at $(git rev-parse HEAD)."

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Notes come from the changelog, so the release page and the file in the repository cannot
          # drift apart.
          ./.github/scripts/changelog-section.sh "$version" > notes.md
          {
            echo ""
            echo "## Using it"
            echo ""
            echo "Gradle — every module is on Maven Central under \`io.github.mgilbir.astervega\`:"
            echo ""
            echo '```kotlin'
            echo "implementation(\"io.github.mgilbir.astervega:vega-runtime:$version\")"
            echo "implementation(\"io.github.mgilbir.astervega:vega-lite:$version\")"
            echo '```'
            echo ""
            echo "Swift Package Manager — the XCFramework is attached below, and \`Package.swift\` at"
            echo "tag \`v$version\` names it with its checksum:"
            echo ""
            echo '```swift'
            echo ".package(url: \"https://github.com/${GITHUB_REPOSITORY}\", from: \"$version\")"
            echo '```'
          } >> notes.md

          gh release create "v$version" \
            --title "Aster Vega $version" \
            --notes-file notes.md \
            --latest \
            artifacts/*
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$version"
