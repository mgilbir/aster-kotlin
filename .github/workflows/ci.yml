name: CI

# Every push and pull request. The repository had no CI at all until the release work needed it,
# which meant `main` was only ever as green as the last person's local run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref. Native compiles are slow and there is
  # no value in finishing a run for a commit nobody is waiting on.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds the JVM and linuxX64 targets and runs the differential oracles, which need
          # node and the pinned upstream packages.
          - name: Check (Linux, JVM + linuxX64)
            os: ubuntu-latest
            oracles: "true"
          # macOS is the only host that compiles the Apple targets, and the only one that can run the
          # Swift renderer's own suite.
          - name: Check (macOS, every target + Swift)
            os: macos-latest
            oracles: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record upstream's test vectors
        # `check.sh` says it will skip the replays without these, but the replay guards also assert
        # the harness has not *shrunk* — `replayed >= 60` — so on a fresh clone they fail rather than
        # skip. The vectors are gitignored by design, being derived, so CI records them first.
        run: ./scripts/record-upstream-vectors.sh

      - name: Check
        run: ./scripts/check.sh

      - name: Differential tests against upstream Vega
        if: matrix.oracles == 'true'
        run: ./scripts/oracle.sh

      - name: Differential tests against upstream Vega-Lite
        if: matrix.oracles == 'true'
        run: ./scripts/vega-lite-oracle.sh

      - name: Swift renderer
        # macOS only: it links the framework Kotlin/Native exports, and the API-surface guard in it is
        # what catches a change to what Swift sees.
        if: runner.os == 'macOS'
        run: ./scripts/swift-test.sh

      - name: Type-check the iOS demo
        if: runner.os == 'macOS'
        run: ./scripts/ios-demo.sh --check

      - name: Check every declared target is in the module metadata
        # macOS only, and deliberately: on any other host it is *expected* to fail, because Kotlin
        # creates no publication for a target the host cannot compile.
        if: runner.os == 'macOS'
        run: ./gradlew verifyPublishedVariants

      - name: Build and check the Central bundle
        # Not only at release time. A publication that would be missing from the bundle is much
        # cheaper to find on a pull request than on the one run that uploads it.
        if: runner.os == 'macOS'
        run: ./gradlew centralBundle verifyCentralBundle --no-configuration-cache

      - name: Say how many tests actually ran
        # A green run that skipped everything is worse than a red one, and nothing in Gradle's output
        # says which happened: it prints a count only for test tasks that *fail*. So the counts are
        # summed from the JUnit XML and held to a floor.
        #
        # The floor is what this host runs today, less a margin — not a target. It is here to catch a
        # suite that stopped running, which is exactly what a missing fixture directory looks like:
        # tests that quietly assume themselves away rather than failing.
        if: always()
        run: |
          set -euo pipefail
          python3 - "${{ runner.os }}" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          from collections import Counter
          host = sys.argv[1]
          total = skipped = failed = 0
          per, per_skip = Counter(), Counter()
          for path in glob.glob("*/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              tests = int(root.get("tests", 0))
              total += tests
              skipped += int(root.get("skipped", 0))
              failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              module = path.split("/")[0]
              per[module] += tests
              per_skip[module] += int(root.get("skipped", 0))
          print(f"{total} tests, {skipped} skipped, {failed} failed")
          for module in sorted(per):
              print(f"  {module:32} {per[module]:5} tests, {per_skip[module]:4} skipped")

          # macOS compiles and runs every target; Linux runs the JVM and linuxX64 suites only.
          floor = 7000 if host == "macOS" else 5000
          if total < floor:
              print(f"::error::only {total} tests ran; expected at least {floor}. "
                    "A suite has stopped running — check for missing fixtures.")
              sys.exit(1)
          # Skips are for a genuinely absent capability, and there are two of those. A jump means
          # tests are assuming themselves away.
          if skipped > 50:
              print(f"::error::{skipped} tests skipped, which is more than this suite should skip.")
              sys.exit(1)
          print(f"{total} tests ran on {host}, {skipped} skipped — above the floor of {floor}.")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/**"
          retention-days: 14
