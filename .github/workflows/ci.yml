name: CI

# `main` only, plus a manual trigger. Not pull requests: a run is about thirty minutes across the two
# hosts, and at the rate branches land here that is not worth paying on every push to every branch.
# The gates are the ones `scripts/check.sh` runs locally, and running it before landing is the working
# agreement. It is one script now: it subsumed `swift-test.sh`, `android-api.sh` and the two oracles,
# after three separate occasions on which something reached `main` or a release because a gate existed
# and was not the one people ran.
#
# What that trades away, so it is a choice rather than a surprise: nothing checks a branch on a host
# other than the one it was written on, and a host-specific failure is found on `main` after the merge
# rather than before it. Both failures this workflow has caught were exactly that kind — a `libm` that
# rounds differently on glibc, and a font the runner resolves differently. So expect to fix forward on
# `main` occasionally, and keep this green, because it is the gate a release is cut behind.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref. Native compiles are slow and there is
  # no value in finishing a run for a commit nobody is waiting on.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds the JVM and linuxX64 targets and runs the differential oracles, which need
          # node and the pinned upstream packages.
          - name: Check (Linux, JVM + linuxX64)
            os: ubuntu-latest
            oracles: "true"
          # macOS is the only host that compiles the Apple targets, and the only one that can run the
          # Swift renderer's own suite.
          - name: Check (macOS, every target + Swift)
            os: macos-latest
            oracles: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Set up Gradle
        # v5, not the current v6, and deliberately: v6 moved the caching component out of the
        # open-source action into a separate library under Gradle's Terms of Use, which upgrading
        # accepts on the project's behalf. v5 is what clears the Node 20 deprecation without taking
        # that on. Revisit as a licensing decision, not a version bump.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Record upstream's test vectors
        # **This step is the protection, not a convenience.** Each replay guards its own vector file
        # with an assumption, so a missing file *skips* the whole test and the `replayed >= N` floor
        # inside it never runs — a skipped test runs nothing. The floor catches a set that is partly
        # there, which is a different failure. This comment used to claim the replays fail rather
        # than skip on a fresh clone, which read as though forgetting this step would be loud.
        #
        # The vectors are gitignored by design, being derived from the pinned upstream packages.
        run: ./scripts/record-upstream-vectors.sh

      - name: Render upstream's Vega-Lite scenes
        # Same reason as the vectors above, and a much bigger hole. The scene half of the Vega-Lite
        # differential pair is gitignored — sixteen megabytes of output nobody reads a diff of — and
        # `VegaLiteFixtureDifferentialTest` responds to its absence with an assumption, not a failure.
        # So 1126 tests, the gate that catches a specification which matches upstream property for
        # property and still draws the wrong chart, skipped in every run of this workflow. Rendering
        # them here arms it. This runs on both hosts: the Vega-Lite oracle step below is Linux-only,
        # and macOS needs the scenes just as much.
        run: ./scripts/vega-lite-oracle.sh --references-only

      - name: Check
        # `--fast` because this workflow runs the two differential oracles as their own steps below,
        # on Linux only, and `check.sh` would otherwise run them a second time — on both hosts, since
        # node is installed here. The split is deliberate: the oracles re-run `:vega-runtime:jvmTest`
        # under `--tests` filters, which *replaces* the test-results directory, and the count assertion
        # further down has to read the results of this step rather than of a filtered re-run.
        #
        # Everything else `check.sh` gained is wanted here: on macOS it now runs the Swift suite, the
        # exported-API snapshot and the iOS demo's type-check, which used to be three separate steps
        # in this file and one that was missing from the local gate entirely.
        env:
          # Asks `swift-test.sh` for xUnit XML so the Apple suite's results can be merged into
          # SUPPORTED_FEATURES.md by the `capabilities` job. macOS-only in effect; on Linux the
          # Swift gate skips and the variable goes unread.
          SWIFT_XUNIT_OUTPUT: ${{ runner.temp }}/swift-xunit.xml
        run: ./scripts/check.sh --fast

      - name: Snapshot what check.sh ran
        # Taken here, before the oracle steps, because a Gradle test task *replaces* its results
        # directory. `oracle.sh` re-runs `:vega-runtime:jvmTest` under `--tests` filters, so after it
        # the directory holds the four fixture classes it asked for and no trace of the other
        # forty-two — which read as a suite that had shrunk from 2787 tests to 2276 when it had not.
        # The counts below are of `check.sh`'s run, which is the run being asserted about.
        if: always()
        run: |
          set -euo pipefail
          for xml in */build/test-results/*/*.xml; do
            [ -f "$xml" ] || continue
            destination="/tmp/check-test-results/$(dirname "$xml")"
            mkdir -p "$destination"
            cp "$xml" "$destination/"
          done

      - name: Differential tests against upstream Vega
        if: matrix.oracles == 'true'
        run: ./scripts/oracle.sh

      - name: Differential tests against upstream Vega-Lite
        if: matrix.oracles == 'true'
        run: ./scripts/vega-lite-oracle.sh

      # The iOS simulator suite used to be a step of its own here, because this project's machine
      # was believed to have no simulator runtime. It has one, so `check.sh` runs
      # `iosSimulatorArm64Test` itself now and a separate step would only run it twice. That
      # direction matters: a gate that lives only in this file is one nobody runs before landing,
      # which is the failure the header above describes and which this exact step demonstrated — it
      # was the step that caught a zone pin the local gate could not see.

      - name: Check every declared target is in the module metadata
        # macOS only, and deliberately: on any other host it is *expected* to fail, because Kotlin
        # creates no publication for a target the host cannot compile.
        if: runner.os == 'macOS'
        run: ./gradlew verifyPublishedVariants

      - name: Build and check the Central bundle
        # Not only at release time. A publication that would be missing from the bundle is much
        # cheaper to find on an ordinary run of `main` than on the one run that uploads it.
        if: runner.os == 'macOS'
        run: ./gradlew centralBundle verifyCentralBundle --no-configuration-cache

      - name: Say how many tests actually ran
        # A green run that quietly skipped a suite is worse than a red one, and nothing in Gradle's
        # output distinguishes them: it prints a test count only for tasks that *fail*. The first run
        # of this workflow reported two numbers, both from failures, and said nothing whatsoever about
        # the other eleven test tasks. So the counts are summed from the JUnit XML here.
        #
        # Two assertions, and the per-module one is the one that bites. A whole-suite floor would not
        # have caught what actually happened: vega-runtime — 2787 tests, holding both differential
        # gates — did not run at all, because the build stopped at the first failing module. Naming
        # the modules is what makes "the suite ran" checkable rather than plausible.
        if: always()
        run: |
          set -euo pipefail
          python3 - "${{ runner.os }}" /tmp/check-test-results <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          from collections import Counter

          host, root = sys.argv[1], sys.argv[2]
          total = skipped = failed = 0
          per, per_skip = Counter(), Counter()
          for path in glob.glob(f"{root}/*/build/test-results/**/*.xml", recursive=True):
              try:
                  suite = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              tests = int(suite.get("tests", 0))
              total += tests
              skipped += int(suite.get("skipped", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              module = path[len(root) :].lstrip("/").split("/")[0]
              per[module] += tests
              per_skip[module] += int(suite.get("skipped", 0))

          print(f"{total} tests, {skipped} skipped, {failed} failed")
          for module in sorted(per):
              print(f"  {module:34}{per[module]:6} tests, {per_skip[module]:4} skipped")

          # Which classes skipped, and why. Reading this out of the log is the difference between
          # "some tests skipped" and "the Vega-Lite scene gate is not running".
          if skipped:
              where, why = Counter(), {}
              for path in glob.glob(f"{root}/*/build/test-results/**/*.xml", recursive=True):
                  try:
                      suite = ET.parse(path).getroot()
                  except ET.ParseError:
                      continue
                  for case in suite.iter("testcase"):
                      for skip in case.iter("skipped"):
                          name = case.get("classname", "?").rsplit(".", 1)[-1]
                          where[name] += 1
                          why.setdefault(name, (skip.get("message") or "").strip()[:160])
              print("skipped by class:")
              for name, count in where.most_common():
                  print(f"  {name} ({count}): {why[name]}")

          problems = []

          # Every host runs the JVM suites, so every host owes these. The counts are what this
          # workflow observed, less a margin; they are a shrink detector, not a target to grow.
          for module, least in (
              ("vega-runtime", 2500),
              ("vega-lite", 800),
              ("vega-expression", 440),
              ("vega-dataflow", 210),
              ("vega-scene", 170),
              ("vega-model", 70),
              ("vega-svg", 25),
              ("vega-loader", 9),
              ("vega-compose-multiplatform", 20),
          ):
              if per[module] < least:
                  problems.append(f"{module} ran {per[module]} tests, expected at least {least}")

          # macOS additionally runs the commonTest suites on Kotlin/Native.
          if host == "macOS":
              native = sum(
                  int(ET.parse(p).getroot().get("tests", 0))
                  for p in glob.glob(f"{root}/*/build/test-results/*Arm64Test/**/*.xml", recursive=True)
              )
              if native < 20:
                  problems.append(f"only {native} tests ran on Kotlin/Native, expected at least 20")

          # The replays guard their own size internally (`replayed >= 60`, `>= 9750`), so a skip here
          # means a suite decided its fixtures were absent. Two are legitimately conditional.
          if skipped > 10:
              problems.append(f"{skipped} tests skipped; suites are assuming themselves away")

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"{total} tests ran on {host}, {skipped} skipped, every expected module present.")
          PY

      - name: Upload test reports
        # **Always, not only on failure.** These were a debugging aid; they are now an input.
        # `SUPPORTED_FEATURES.md`'s status column is generated from the union of every job's
        # results, so a green job that uploaded nothing would render its own rows as unproven —
        # the document would be reporting on the upload rather than on the tests.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            ${{ runner.temp }}/swift-xunit.xml
            build/upstream-transform-ledger.txt
          retention-days: 14

  # The instrumented Android suites, defined in their own workflow and called from here and from
  # `release.yml`. See `.github/workflows/instrumented.yml` for why they exist and why both callers
  # share one definition.
  android:
    name: Instrumented
    uses: ./.github/workflows/instrumented.yml

  # -------------------------------------------------------------------------------------------
  # SUPPORTED_FEATURES.md, generated from the results of the jobs above.
  #
  # The document is what an adopter reads before depending on any of this, and until now nothing
  # checked it. It drifted the way an unchecked document does: one row said `isDate`, `isRegExp` and
  # `isTuple` "stay out with reasons" while all three were implemented, and a row seventy lines below
  # listed `isRegExp()` as supported — the file disagreeing with itself and with the code (#154).
  #
  # So the status column is not written by a person any more. It is computed from whether each row's
  # cited tests **ran and passed**, which is the one part of the claim a run can settle. A row that
  # says `Supported` and cites a suite that did not run says so, in the document, where a reader
  # sees it.
  #
  # **This job is why the results are merged rather than taken from one place.** No single job sees
  # everything: macOS compiles every Apple target and runs the Swift suite, Linux runs `linuxX64`,
  # and the instrumented suites need an emulator and run in their own jobs. Generating from any one
  # of them marks every other host's rows unproven, so this waits for all four and takes the union.
  #
  # It commits, because a document generated from a run is only useful if the run's answer is what
  # the repository holds. Nothing else may change in that commit — the check below is what says so.
  capabilities:
    name: SUPPORTED_FEATURES.md
    needs: [check, android]
    # `always()`, so a red suite still regenerates: a failing test should turn its rows into
    # **Failing** in the document rather than leave the last green run's claim standing.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Collect every job's test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results

      - name: Regenerate from the merged results
        run: |
          set -euo pipefail
          # One directory per uploading job; the script keys on the simple class name so the three
          # XML dialects — Gradle's JVM suites, a Kotlin/Native target's prefixed ones, and the
          # instrumented runner's — merge into one answer per suite.
          # An array rather than word-splitting a command substitution: an artifact directory is
          # named after the job that uploaded it, and those names carry spaces and parentheses.
          mapfile -t artifacts < <(find results -maxdepth 1 -mindepth 1 -type d | sort)
          printf '  artifact: %s\n' "${artifacts[@]}"
          python3 scripts/capabilities.py --write --results "${artifacts[@]}"

      - name: Commit it if the run changed the answer
        run: |
          set -euo pipefail
          if git diff --quiet SUPPORTED_FEATURES.md; then
            echo "the document already matches this run"
            exit 0
          fi
          # Nothing but the generated document may move in this commit. A generator that also
          # rewrote source would be a workflow editing the repository behind the review, which is
          # exactly the thing a bot commit has to be unable to do.
          changed=$(git diff --name-only)
          if [ "$changed" != "SUPPORTED_FEATURES.md" ]; then
            echo "::error::regeneration touched more than the document: $changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUPPORTED_FEATURES.md
          git commit -m "Regenerate SUPPORTED_FEATURES.md from ${GITHUB_SHA:0:8}

          The status column is computed from whether each row's cited tests ran and passed,
          merged across every job in this run. Written by the capabilities job in ci.yml."
          git push
