name: CI

# `main` only, plus a manual trigger. Not pull requests: a run is about thirty minutes across the two
# hosts, and at the rate branches land here that is not worth paying on every push to every branch.
# The gates are the ones `scripts/check.sh` runs locally, and running it before landing is the working
# agreement. It is one script now: it subsumed `swift-test.sh`, `android-api.sh` and the two oracles,
# after three separate occasions on which something reached `main` or a release because a gate existed
# and was not the one people ran.
#
# What that trades away, so it is a choice rather than a surprise: nothing checks a branch on a host
# other than the one it was written on, and a host-specific failure is found on `main` after the merge
# rather than before it. Both failures this workflow has caught were exactly that kind — a `libm` that
# rounds differently on glibc, and a font the runner resolves differently. So expect to fix forward on
# `main` occasionally, and keep this green, because it is the gate a release is cut behind.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref. Native compiles are slow and there is
  # no value in finishing a run for a commit nobody is waiting on.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate on both hosts, defined in `.github/workflows/gate.yml` and shared with `release.yml`.
  check:
    name: Check
    uses: ./.github/workflows/gate.yml

  # The instrumented Android suites, defined in their own workflow and called from here and from
  # `release.yml`. See `.github/workflows/instrumented.yml` for why they exist and why both callers
  # share one definition.
  android:
    name: Instrumented
    uses: ./.github/workflows/instrumented.yml

  # -------------------------------------------------------------------------------------------
  # SUPPORTED_FEATURES.md, generated from the results of the jobs above.
  #
  # The document is what an adopter reads before depending on any of this, and until now nothing
  # checked it. It drifted the way an unchecked document does: one row said `isDate`, `isRegExp` and
  # `isTuple` "stay out with reasons" while all three were implemented, and a row seventy lines below
  # listed `isRegExp()` as supported — the file disagreeing with itself and with the code (#154).
  #
  # So the status column is not written by a person any more. It is computed from whether each row's
  # cited tests **ran and passed**, which is the one part of the claim a run can settle. A row that
  # says `Supported` and cites a suite that did not run says so, in the document, where a reader
  # sees it.
  #
  # **This job is why the results are merged rather than taken from one place.** No single job sees
  # everything: macOS compiles every Apple target and runs the Swift suite, Linux runs `linuxX64`,
  # and the instrumented suites need an emulator and run in their own jobs. Generating from any one
  # of them marks every other host's rows unproven, so this waits for all four and takes the union.
  #
  # It commits, because a document generated from a run is only useful if the run's answer is what
  # the repository holds. Nothing else may change in that commit — the check below is what says so.
  capabilities:
    name: SUPPORTED_FEATURES.md
    needs: [check, android]
    # `always()`, so a red suite still regenerates: a failing test should turn its rows into
    # **Failing** in the document rather than leave the last green run's claim standing.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Collect every job's test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results

      - name: Regenerate from the merged results
        run: |
          set -euo pipefail
          # One directory per uploading job; the script keys on the simple class name so the three
          # XML dialects — Gradle's JVM suites, a Kotlin/Native target's prefixed ones, and the
          # instrumented runner's — merge into one answer per suite.
          # An array rather than word-splitting a command substitution: an artifact directory is
          # named after the job that uploaded it, and those names carry spaces and parentheses.
          mapfile -t artifacts < <(find results -maxdepth 1 -mindepth 1 -type d | sort)
          printf '  artifact: %s\n' "${artifacts[@]}"
          python3 scripts/capabilities.py --write --results "${artifacts[@]}"

      - name: Commit it if the run changed the answer
        run: |
          set -euo pipefail
          if git diff --quiet SUPPORTED_FEATURES.md; then
            echo "the document already matches this run"
            exit 0
          fi
          # Nothing but the generated document may move in this commit. A generator that also
          # rewrote source would be a workflow editing the repository behind the review, which is
          # exactly the thing a bot commit has to be unable to do.
          changed=$(git diff --name-only)
          if [ "$changed" != "SUPPORTED_FEATURES.md" ]; then
            echo "::error::regeneration touched more than the document: $changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUPPORTED_FEATURES.md
          git commit -m "Regenerate SUPPORTED_FEATURES.md from ${GITHUB_SHA:0:8}

          The status column is computed from whether each row's cited tests ran and passed,
          merged across every job in this run. Written by the capabilities job in ci.yml."
          git push
