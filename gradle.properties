org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Never silently download a JDK; the pinned baseline is documented in README.md.
org.gradle.java.installations.auto-download=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The Linux target compiles here (cross-compilation from macOS) but its test task cannot run on this
# host. There are no native tests to run — every test in this repository is a JVM test — so the
# warning is noise about a task that would be empty anyway.
kotlin.native.ignoreDisabledTargets=true
